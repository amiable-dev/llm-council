# Release Security Workflow
# ADR-035: DevSecOps Implementation - Layer 4
# Issues: #213, #221

name: Release Security

on:
  release:
    types: [published]

# Least-privilege default; jobs below elevate only the scopes they need.
permissions:
  contents: read

jobs:
  sbom-attach:
    name: Attach SBOM to Release
    runs-on: ubuntu-latest
    permissions:
      contents: write  # to attach the SBOM to the release
    outputs:
      sbom-file: ${{ steps.sbom.outputs.filename }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09  # v5

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1  # v6
        with:
          python-version: '3.12'

      - name: Install uv
        uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78  # v7

      - name: Install dependencies
        run: |
          uv pip install --system -e ".[dev]"

      - name: Generate SBOM
        id: sbom
        env:
          REF_NAME: ${{ github.ref_name }}
        run: |
          pip install cyclonedx-bom==4.6.0
          SBOM_FILE="llm-council-${REF_NAME}-sbom.json"
          cyclonedx-py environment -o "$SBOM_FILE" --output-format JSON
          echo "filename=$SBOM_FILE" >> "$GITHUB_OUTPUT"

      - name: Upload SBOM artifact
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f  # v6
        with:
          name: sbom
          path: ${{ steps.sbom.outputs.filename }}

      - name: Attach SBOM to release
        uses: softprops/action-gh-release@3d0d9888cb7fd7b750713d6e236d1fcb99157228  # v3
        with:
          files: ${{ steps.sbom.outputs.filename }}

  # SLSA Level 3 Provenance for release artifacts
  # Uses GitHub's native attestation support (Sigstore-based)
  provenance:
    name: Generate SLSA Provenance
    needs: sbom-attach
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
      attestations: write
    steps:
      - name: Download SBOM artifact
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131  # v7
        with:
          name: sbom

      - name: Generate SLSA provenance attestation
        uses: actions/attest-build-provenance@e8998f949152b193b063cb0ec769d69d929409be  # v2
        with:
          subject-path: ${{ needs.sbom-attach.outputs.sbom-file }}

