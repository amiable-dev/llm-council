# Default tier model pools — THE single source of truth (#690).
#
# This file ships inside the wheel, next to registry.yaml. Both
# `tier_contract._DEFAULT_TIER_MODEL_POOLS` and
# `unified_config.TierConfig.ensure_default_pools` read it; neither holds a
# literal, and `tests/test_issue690_pool_single_source.py` fails if one comes
# back. The repo's own `llm_council.yaml` deliberately does NOT declare
# `tiers.pools`, so this project runs exactly what it publishes.
#
# History: the pools used to be written out three times — here in spirit, in
# both modules above as Python literals, and in `llm_council.yaml`. #685
# updated only the last of those, which does not ship, so every published
# claim about v0.48.0's pools was false for anyone installing from PyPI.
#
# A user overrides these per-tier via `tiers.pools.<tier>` in their own
# llm_council.yaml; any tier they omit falls back to the entry here.
#
# CATALOGUE CHECKED 2026-09-24 (#696) against the live OpenRouter API (458
# models). All 20 pool members still resolve. Registry pricing was corrected for
# four of them — deepseek-v4-pro-0813, deepseek-v4.1-flash, glm-5.3 and
# deepseek-v4-flash had all fallen BEHIND price cuts, by up to 186%, which the
# ADR-011 registry_estimate fallback was billing at the stale rate.
#
# The standing question, answered: there is still NO stable Gemini 3.x Pro. The
# only non-preview 3.x Pro in the catalogue is `gemini-3-pro-image`, an image
# model. `gemini-3.1-pro-preview` therefore stays in frontier and the note below
# stands — next reader, you do not need to re-check this before 2026-10.
#
# NOTHING WAS PROMOTED out of frontier, and that is the audition rule working
# rather than an omission: ADR-029 wants >=30 days and >=100 sessions, and the
# 2026-09-18 intake is six days old.
#
# CATALOGUE CHECKED AGAIN 2026-10-09 (#734). Two successors PROMOTED straight
# into their predecessors' seats, member and chairman, by owner decision:
# haiku-5.5 replaces haiku-4.5 in `quick` (a tenth of the price) and
# sonnet-5.5 replaces sonnet-5 in `balanced`. This deliberately skips the
# ADR-029 audition, which cannot run anyway: the `audition/` package and
# `graduation.py` are imported by no council, verify or selection path, so
# frontier members accrue no sessions and the ">=30 days" clock never starts
# (#730). The promotion was instead gated on a live smoke run at both tiers
# (latencies below). grok-4.7's registry price was corrected the same day.
#
# CATALOGUE CHECKED AGAIN 2026-11-14 (#734, 471 models). The same owner rule —
# a direct successor takes its predecessor's seat if a live smoke run fits the
# tier budget — applied to every seat that had a newer model:
#   quick, balanced   deepseek-v4-flash   -> deepseek-v4.1-flash
#   balanced          gpt-5.6-luna        -> gpt-6-luna
#   balanced          gemini-3.7-flash    -> gemini-3.8-flash
#   high              gpt-5.6-sol         -> gpt-6.1-sol (member and chairman)
#   high, reasoning   claude-opus-5       -> claude-opus-5.5
#   reasoning         gpt-5.6-sol-pro     -> gpt-6.1-sol-pro
# Unchanged because nothing newer exists in the line: gemini-3.5-flash-lite,
# deepseek-v4-pro-0813, glm-5.3. Smoke: 5 councils per tier, 20 of 20 returned
# a synthesis, every member answered every run. Samples are in
# tests/test_tier_pool_hygiene.py::OWNER_PROMOTIONS.
#
# Two kinds of latency figure appear below and they are NOT comparable.
# "store" figures are means from a real performance store
# (`~/.llm-council/performance_metrics.jsonl`, snapshot 2026-09-24), verify-
# sized prompts included. "smoke" figures are stage-1 latency on short consult
# prompts, 2026-11-14. Both are mirrored in MEASURED_LATENCY_S, which enforces
# that every pool member fits its tier's budget.

pools:
  # QUICK: fast models for simple queries.
  quick:
    # flash-lite 3.2s store; v4.1-flash 2.8s smoke (replaced v4-flash, which
    # missed the 20s per-model limit ~40% of the time, #736: 0 of 5 here);
    # haiku-5.5 2.5s smoke (best reasoner of the three; replaced haiku-4.5).
    # No Luna model here: gpt-5.6-luna measured 35.3s store, over the budget of
    # the tier whose whole point is speed, and gpt-6-luna has not been measured
    # at this tier. Any pool member can be selected, so the budget applies to
    # every member, not just the ones that sort first.
    models:
      - google/gemini-3.5-flash-lite
      - deepseek/deepseek-v4.1-flash
      - anthropic/claude-haiku-5.5
    timeout_seconds: 30
    peer_review: lightweight

  # BALANCED: good quality at reasonable latency.
  balanced:
    # Smoke means: gpt-6-luna 3.3s, sonnet-5.5 4.5s, v4.1-flash 5.1s,
    # gemini-3.8-flash 5.8s. Order matters on the fallback path only — the
    # scored path picks on metadata.
    models:
      - openai/gpt-6-luna
      - anthropic/claude-sonnet-5.5
      - deepseek/deepseek-v4.1-flash
      - google/gemini-3.8-flash
    timeout_seconds: 90

  # HIGH: full council deliberation.
  high:
    # gemini-3.1-pro-preview REPLACED by z-ai/glm-5.3 (ADR-027: previews enter
    # via audition, not the default council; frontier already carries it). The
    # replacement is registry-known and measured (n=42), keeps the pool at
    # four, adds a fourth distinct provider, and costs less per run ($0.183 vs
    # $0.245). #734: gpt-6.1-sol (5.2s smoke, half gpt-5.6-sol's price) and
    # opus-5.5 (5.5s smoke) replaced their predecessors; opus-5 measured 195.2s
    # store against this tier's 180s.
    models:
      - openai/gpt-6.1-sol
      - anthropic/claude-opus-5.5
      - deepseek/deepseek-v4-pro-0813
      - z-ai/glm-5.3
    timeout_seconds: 180

  # REASONING: deep reasoning with extended thinking.
  reasoning:
    # As above: the preview lives in frontier. deepseek-v4-pro-0813 keeps this
    # pool at four with a measured, low-cost member ($0.033/run).
    models:
      - openai/gpt-6.1-sol-pro
      - anthropic/claude-opus-5.5
      - z-ai/glm-5.3
      - deepseek/deepseek-v4-pro-0813
    timeout_seconds: 600

  # FRONTIER: the audition entry path (ADR-027/029).
  frontier:
    # Members vote ADVISORY — scored and recorded, but zero weight in
    # consensus — until enough real sessions promote them. The 2026-09-18
    # catalogue additions land here rather than in a default tier precisely
    # because nothing has measured them yet; gemini-3.1-pro-preview sits here
    # for the same reason.
    models:
      # 2026-11-14 intake (#734): new since the last check, no predecessor on
      # a default council. Gemini 4 is the first stable Google flagship since
      # the 3.1 preview; whether one takes a `high` seat is an owner decision.
      - anthropic/claude-fable-5.2
      - google/gemini-4-argon
      - google/gemini-4-carbon
      - google/gemini-4-hydrogen
      # 2026-09-24 intake (#696)
      - x-ai/grok-4.7
      # 2026-09-18 intake
      - anthropic/claude-fable-5.1
      - openai/gpt-6-astra
      # earlier
      - anthropic/claude-fable-5
      - x-ai/grok-4.6
      - google/gemini-3.1-pro-preview
    timeout_seconds: 600
