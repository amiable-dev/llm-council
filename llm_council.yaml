# LLM Council Configuration for llm-council project
# Generated: 2025-12-24 for v0.15.0
#
# This configuration enables the Model Intelligence Layer (ADR-026)
# with appropriate settings for development and self-improvement use cases.
#
# NOTE: The tier pools are NOT here — they ship with the package, in
# src/llm_council/models/default_pools.yaml (#690). Edit them there. Static
# pools are FALLBACKS for when dynamic selection is unavailable; with
# model_intelligence.enabled=true the system selects the latest models
# dynamically. See GitHub Issue #109 for dynamic candidate discovery.

council:
  # =========================================================================
  # LAYER 1: Tier Selection (ADR-022)
  # =========================================================================
  tiers:
    # Default to 'high' for quality council deliberations
    # Use 'frontier' for cutting-edge/preview models
    default: high

    # Pools are NOT declared here. #690: this file is not in the wheel, so a
    # pool list here is a copy that only this checkout sees — which is how
    # #685's model refresh shipped a changelog entry that was false for every
    # PyPI install. The defaults now live in
    # src/llm_council/models/default_pools.yaml and ship with the package;
    # this project deliberately runs them unmodified so it dogfoods what it
    # publishes. To override a tier locally, add `pools: {<tier>: ...}` back —
    # any tier you omit still falls back to the packaged definition.

    escalation:
      enabled: true
      notify_user: true
      max_escalations: 2

  # =========================================================================
  # LAYER 4: Gateway Routing (ADR-023)
  # =========================================================================
  gateways:
    default: openrouter

    providers:
      openrouter:
        enabled: true
        api_key: ${OPENROUTER_API_KEY}

    fallback:
      enabled: true
      chain: [openrouter]

  # =========================================================================
  # Model Intelligence Layer (ADR-026) - ENABLED
  # =========================================================================
  model_intelligence:
    enabled: true

    sources:
      openrouter_api: true
      internal_performance: true

    refresh:
      registry_ttl: 3600           # 1 hour
      availability_ttl: 300        # 5 minutes

    selection:
      min_providers: 2
      default_count: 4

      anti_herding:
        enabled: true
        traffic_threshold: 0.3     # 30%
        max_penalty: 0.35          # 35%

    parameters:
      auto_reasoning: true
      reasoning_effort_by_tier:
        quick: minimal
        balanced: low
        high: medium
        reasoning: high

    # Internal Performance Tracking (Phase 3)
    performance_tracker:
      enabled: true
      store_path: "${HOME}/.llm-council/performance_metrics.jsonl"
      decay_days: 30
      min_samples_preliminary: 10
      min_samples_moderate: 30
      min_samples_high: 100

  # =========================================================================
  # Evaluation (ADR-031 consolidated section: rubric / safety / bias)
  # Migrated from the pre-ADR-024 `bias_audit`/`bias_persistence`/`scoring`
  # sections, which the schema never read — silently before #591, with a
  # warning since. Bias auditing stays ENABLED for self-improvement
  # (ADR-015, ADR-018).
  # =========================================================================
  evaluation:
    bias:
      audit_enabled: true
      persistence_enabled: true
      store_path: "${HOME}/.llm-council/bias_data.jsonl"
      consent_level: LOCAL_ONLY
      length_correlation_threshold: 0.7
      position_variance_threshold: 0.5
    rubric:
      enabled: false               # Enable for detailed scoring (ADR-016)
    safety:
      enabled: false               # Enable if safety filtering needed

  # =========================================================================
  # Council Behavior
  # =========================================================================
  council:
    mode: consensus                # 'consensus' or 'debate'
    exclude_self_votes: true       # Prevent self-preference bias
    style_normalization: false     # Optional anonymization enhancement

  # =========================================================================
  # Credentials (referenced from environment)
  # =========================================================================
  credentials:
    openrouter: ${OPENROUTER_API_KEY}
